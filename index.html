<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A 2026 joint workshop exploring AI-driven autonomous security, semantic communication, mission-critical IoT, and human–AI teaming." />
    <meta name="theme-color" content="#07111f" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="2026 Joint Workshop · Working Theme" />
    <meta property="og:description" content="AI-driven autonomous security across communication, sensing, and human–AI collaboration." />
    <title>AI-Driven Autonomous Security — IISL Workshop 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&amp;family=Inter:wght@400;500;600;700;800&amp;family=Roboto+Condensed:wght@300;400;500;600;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=78" />
    <link rel="icon" href="data:," />
    <script src="content.js?v=64" defer></script>
    <script src="translations.js?v=11" defer></script>
    <script src="script.js?v=69" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content" data-i18n="Skip to content">Skip to content</a>

    <header class="site-header" id="top">
      <nav class="nav shell" aria-label="Main navigation" data-i18n-aria-label="Main navigation">
        <a class="brand" href="./" aria-label="Reload the workshop homepage" data-i18n-aria-label="Reload the workshop homepage">
          <span id="nav-brand">IISL Workshop 2026</span>
        </a>

        <div class="nav-actions">
          <div class="nav-links" id="nav-links">
            <a href="#about" data-i18n="Scope">Scope</a>
            <a href="#program" data-i18n="Program">Program</a>
            <a href="#speakers" data-i18n="Speakers">Speakers</a>
            <a href="#venue" data-i18n="Venue">Venue</a>
            <a href="#institutions" data-i18n="Institutions">Institutions</a>
          </div>
          <button class="language-toggle" id="language-toggle" type="button" lang="ko" aria-label="한국어로 전환">한국어</button>
          <button class="menu-button" type="button" aria-expanded="false" aria-controls="nav-links">
            <span></span><span></span><span></span>
            <span class="sr-only" id="menu-label">Open navigation</span>
          </button>
        </div>
      </nav>
    </header>

    <main id="main-content">
      <section class="hero">
        <div class="hero-pattern" aria-hidden="true"></div>
        <div class="shell hero-inner">
          <div class="hero-art" aria-hidden="true"></div>
          <p class="eyebrow reveal" id="hero-eyebrow"></p>
          <h1 class="hero-title reveal">
            <span id="hero-title"></span>
            <em id="hero-title-accent"></em>
          </h1>
          <p class="hero-theme reveal" id="hero-theme"></p>
          <p class="hero-eventline reveal">
            <span id="hero-date"></span>
            <span class="hero-event-separator" aria-hidden="true">·</span>
            <span id="hero-location"></span>
          </p>
          <p class="hero-summary reveal" id="hero-summary"></p>
          <div class="theme-chips reveal" id="theme-chips"></div>
          <div class="hero-actions reveal" id="hero-actions"></div>
          <div class="event-facts reveal" id="event-facts"></div>
        </div>
      </section>

      <section class="section about-section" id="about">
        <div class="shell">
          <div class="section-heading reveal">
            <p class="section-label" id="about-label"></p>
            <h2 id="about-title"></h2>
          </div>
          <div class="about-layout">
            <div class="about-copy reveal" id="about-copy"></div>
            <div class="topic-list" id="topic-list"></div>
          </div>
        </div>
      </section>

      <section class="section program-section" id="program">
        <div class="shell">
          <div class="section-heading split-heading reveal">
            <div>
              <p class="section-label" data-i18n="Workshop schedule">Workshop schedule</p>
              <h2 id="program-title"></h2>
            </div>
            <p class="section-note" id="program-note"></p>
          </div>
          <div class="program-list reveal" id="program-list"></div>
        </div>
      </section>

      <section class="section speakers-section" id="speakers">
        <div class="shell">
          <div class="section-heading reveal">
            <p class="section-label" data-i18n="Speaker lineup">Speaker lineup</p>
            <h2 id="speakers-title"></h2>
          </div>
          <div class="speaker-grid" id="speaker-grid"></div>
        </div>
      </section>

      <section class="section venue-section" id="venue">
        <div class="shell venue-layout">
          <div class="venue-copy reveal">
            <p class="section-label" data-i18n="Venue">Venue</p>
            <h2 id="venue-name"></h2>
            <p class="venue-address" id="venue-address"></p>
            <div class="venue-details" id="venue-details"></div>
          </div>
          <div class="venue-map-column reveal">
            <div class="map-card">
              <iframe
                class="venue-map"
                id="venue-map"
                title="Interactive map showing GIST Seoul Office"
                loading="lazy"
                referrerpolicy="strict-origin-when-cross-origin"
              ></iframe>
            </div>
            <div class="venue-actions" id="venue-actions"></div>
          </div>
        </div>
      </section>

      <section class="section institutions-section" id="institutions">
        <div class="shell">
          <div class="section-heading reveal">
            <p class="section-label" data-i18n="Institutions">Institutions</p>
            <h2 data-i18n="Hosted and supported by.">Hosted and supported by.</h2>
          </div>
          <div class="institution-groups">
            <div class="institution-group reveal">
              <p class="card-label" data-i18n="Hosted by">Hosted by</p>
              <div class="institution-grid host-grid" id="host-grid"></div>
            </div>
            <div class="institution-group reveal">
              <p class="card-label" data-i18n="Supported by">Supported by</p>
              <div class="institution-grid support-grid" id="support-grid"></div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="shell footer-top">
        <div>
          <a class="brand footer-brand" href="./">
            <span id="footer-brand">IISL Workshop 2026</span>
          </a>
          <p id="footer-tagline"></p>
        </div>
      </div>
      <div class="shell footer-bottom">
        <span id="copyright"></span>
      </div>
    </footer>
  </body>
</html>
